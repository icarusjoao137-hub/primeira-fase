<!DOCTYPE html>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>


     <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: white;
        }

        .imagem-topo {
            display: block;
            margin: 0 auto 20px;
            width: 800px;
            max-width: 100%;
            border-radius: 15px;
        }

        form {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.3);
        }

        fieldset {
            border: 2px solid #0077ff;
            border-radius: 10px;
            margin-bottom: 20px;
            padding: 15px;
        }

        legend {
            font-weight: bold;
            color: #0077ff;
            font-size: 18px;
        }

        label {
            font-weight: bold;
            color: #333;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"],
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .botoes {
            text-align: center;
        }

        input[type="submit"] {
            background-color: green;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type="reset"] {
            background-color: red;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: darkgreen;
        }

        input[type="reset"]:hover {
            background-color: darkred;
        }
    </style>
</head>

<body>

    <h1>Formulário de Cadastro</h1>

    <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f"
         class="imagem-topo"
         alt="Estudantes">

</head>
<body>
     <form>
        <fieldset>
            <legend>dados pessoais</legend>
            <label for="nome_completo">nome completo:</label>
            <input type="text" id="nome_completo" name="nome_completo" placeholder="digite seu nome aqui">

        <label for="nome_mae">nome da mãe:</label>
        <input type="text" id="nome_mae" name="nome_mae" placeholder="digite o nome da mãe aqui">

        <label for="data_nascimento">data de nascimento:</label>
        <input type="text" id="data_nascimento" name="data_nascimento" placeholder="dd/mm/aaaa">               

        <label for="senha">senha</label>
        <input type="password" id="senha" name="senha" placeholder="digite sua senha aqui">

        <label for="cidade">cidade:</label>
        <input type="text" id="cidade" name="cidade" placeholder="digite sua cidade aqui">

        <label for="estado">estado:</label>
        <input type="text" id="estado" name="estado" placeholder="digite seu estado aqui">
        </fieldset>
     </form>

     <form>
        <fieldset>
            <legend>Informações de Contato</legend>
            <label for="email">e-mail:</label>
            <input type="email" id="email" name="email" placeholder="digite seu e-mail aqui">
            <label for="uf">unidade federativa:</label>
            <select name="uf" id="uf">
                <option value="">Selecione sua unidade federativa</option>
               <option value="AC">Acre</option>
               <option value="AL">Alagoas</option>
               <option value="AP">Amapá</option>
                <option value="AM">Amazonas</option>
                <option value="BA">Bahia</option>
                <option value="CE">Ceará</option>
                <option value="DF">Distrito Federal</option>
                <option value="ES">Espírito Santo</option>
                <option value="GO">Goiás</option>
                <option value="MA">Maranhão</option>
                <option value="MT">Mato Grosso</option>
                <option value="MS">Mato Grosso do Sul</option>
                <option value="MG">Minas Gerais</option>
                <option value="PA">Pará</option>
                <option value="PB">Paraíba</option>
                <option value="PR">Paraná</option>
                <option value="PE">Pernambuco</option>
                <option value="PI">Piauí</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="RN">Rio Grande do Norte</option>
                <option value="RS">Rio Grande do Sul</option>
                <option value="RO">Rondônia</option>
                <option value="RR">Roraima</option>
                <option value="SC">Santa Catarina</option>
                <option value="SP">São Paulo</option>
                <option value="SE">Sergipe</option>
                <option value="TO">Tocantins</option>
        </fieldset>

        <fieldset>
            <legend>genero</legend>
            <label for="sexo">selecione apenas uma opção</label>
            <input type="radio" id="masculino" name="genero" value="M">

            <label for="masculino">Masculino</label>
            <input type="radio" id="feminino" name="genero" value="F">
            <label for="feminino">Feminino</label>

            <input type="radio" id="outro" name="genero" value="outro">
            <label for="outro">não binário</label>

            <input type="radio" id="nao_informar" name="sexo" value="nao_informar">
            <label for="nao_informar">Prefiro não informar</label>
        </fieldset>

        <fieldset>
            <legend>curso</legend>
            <label for="ti">TI</label>
            <input type="checkbox" id="ti" name="curso" value="ti">

            <label for="mecanica_a">mecanica naval</label>
            <input type="checkbox" id="mecanica_a" name="curso" value="mecanica_a">

            <label for="mecanica_b">mecanica nuclear</label>
            <input type="checkbox" id="mecanica_b" name="curso" value="mecanica_b">
        </fieldset>

        <input type="submit" value="enviar">
        <input type="reset" value="limpar">
     </form>
</body>
</html>
